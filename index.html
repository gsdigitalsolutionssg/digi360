<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIGI360 — Safety Induction</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#0B0F14;--bg2:#111920;--card:#172030;--card-h:#1C2840;--tx:#E4E8EE;--tx2:#8899AA;--mt:#4A5A6A;--ac:#F59E0B;--ac2:#D97706;--abg:rgba(245,158,11,.08);--ok:#10B981;--err:#EF4444;--inf:#06B6D4;--bd:#1E2E42;--rd:12px;--sbw:260px;--hdh:60px}
[data-theme="light"]{--bg:#F3F5F9;--bg2:#FFF;--card:#FFF;--card-h:#F0F3F7;--tx:#111827;--tx2:#5A6B7E;--mt:#9CA3AF;--bd:#E2E8F0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,.fd{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--mt);border-radius:3px}
.b{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:all .15s;font-family:inherit;min-height:44px}
.bp{background:var(--ac);color:#000}.bp:hover{background:var(--ac2);transform:translateY(-1px)}
.bs{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.bs:hover{background:var(--card-h)}
.bd{background:var(--err);color:#fff}.bg{background:var(--ok);color:#fff}
.bsm{padding:6px 14px;font-size:12px;min-height:36px;min-width:36px}.b:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.i{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:14px;font-family:inherit;min-height:44px}.i:focus{outline:none;border-color:var(--ac)}.i:disabled{opacity:.65}
.sl{padding-right:14px}
.lb{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-pending{background:rgba(251,191,36,.12);color:#FBBF24}.b-wrn{background:rgba(251,191,36,.12);color:#FBBF24}
.b-ok{background:rgba(16,185,129,.12);color:#10B981}.b-in{background:rgba(6,182,212,.12);color:#06B6D4}
.b-out{background:rgba(139,92,246,.12);color:#8B5CF6}.b-err{background:rgba(239,68,68,.12);color:#EF4444}.b-inv{background:rgba(96,165,250,.12);color:#60A5FA}
.b-adm{background:rgba(245,158,11,.12);color:#F59E0B}.b-mgr{background:rgba(6,182,212,.12);color:#06B6D4}.b-sec{background:rgba(139,92,246,.12);color:#8B5CF6}.b-ind{background:rgba(16,185,129,.12);color:#10B981}.b-sup{background:rgba(139,92,246,.12);color:#8B5CF6}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2)}
#ls{min-height:100vh;display:flex;overflow:hidden}
.ll{flex:1;background:linear-gradient(135deg,#0B0F14,#172030 50%,#1a1000);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.ll canvas{position:absolute;inset:0;width:100%;height:100%}
.lr{width:480px;max-width:100%;background:var(--bg2);display:flex;flex-direction:column;justify-content:center;padding:48px;position:relative;z-index:2;overflow-y:auto}
.lmt{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:24px}
.lmt button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;background:transparent;color:var(--tx2);font-family:inherit;min-height:48px}.lmt button.act{background:var(--ac);color:#000}
.qf{color:var(--ac);text-decoration:underline;cursor:pointer;font-size:13px}
#app{display:none;min-height:100vh}
#sb{width:var(--sbw);background:var(--bg2);border-right:1px solid var(--bd);position:fixed;top:0;left:0;bottom:0;z-index:1000;display:flex;flex-direction:column;transition:transform .3s ease}
#sb.col{width:72px}#sb.col .nl,#sb.col .sht,#sb.col .sui{display:none}#sb.col .ni{justify-content:center;padding:12px}
.ni{display:flex;align-items:center;gap:12px;padding:12px 20px;margin:2px 8px;border-radius:8px;cursor:pointer;color:var(--tx2);font-size:14px;font-weight:500;min-height:48px}
.ni:hover{background:var(--abg);color:var(--tx)}.ni.act{background:var(--abg);color:var(--ac);font-weight:600}.ni i{width:20px;text-align:center;font-size:15px}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999}
#ma{margin-left:var(--sbw);transition:margin-left .3s;min-height:100vh}#sb.col~#ma{margin-left:72px}
#hd{height:var(--hdh);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:500;gap:8px}
@media(min-width:769px){#hd{padding:0 24px}}
#pc{padding:16px;max-width:1400px;margin:0 auto}
@media(min-width:769px){#pc{padding:24px}}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;animation:fi .2s;padding:16px}
.md{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;animation:su .3s;-webkit-overflow-scrolling:touch}
@media(min-width:769px){.md{padding:32px}}
@media(max-width:768px){.mo{padding:0;align-items:flex-end}.md{max-height:92vh;border-radius:16px 16px 0 0;max-width:100%}}
.md-lg{max-width:820px}
#tc{position:fixed;top:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 40px)}
.tt{padding:14px 20px;border-radius:10px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:280px;box-shadow:var(--sh);animation:si .3s}
@media(max-width:768px){.tt{min-width:auto;width:100%}}
.ts{background:#065F46;color:#A7F3D0;border:1px solid #10B981}.te{background:#7F1D1D;color:#FCA5A5;border:1px solid #EF4444}.ti{background:#164E63;color:#A5F3FC;border:1px solid #06B6D4}.tw{background:#78350F;color:#FDE68A;border:1px solid #F59E0B}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes si{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--mt);flex-wrap:wrap}
.breadcrumb a{color:var(--tx2);cursor:pointer;text-decoration:none}.breadcrumb a:hover{color:var(--ac)}
.bc-sep{font-size:10px}.bc-cur{color:var(--tx);font-weight:600}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--rd);padding:16px}
@media(min-width:769px){.c{padding:20px}}
.p0{padding:0!important}
.kpi{position:relative;overflow:hidden}.kpi::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.06}
.kpi.amber::after{background:var(--ac)}.kpi.green::after{background:var(--ok)}.kpi.cyan::after{background:var(--inf)}.kpi.red::after{background:var(--err)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
@media(min-width:769px){.kgrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}}
.two{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:20px}
@media(min-width:901px){.two{grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}}
.form-row{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.form-row{grid-template-columns:1fr 1fr}}
.form-row-3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.form-row-3{grid-template-columns:1fr 1fr 1fr}}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:10px 20px;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:var(--tx2);font-family:inherit;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.seg button.act{background:var(--ac);color:#000}
.seg.sm button{padding:8px 16px;font-size:12px;min-height:40px}
.pb{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;min-width:40px}
.pf{height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:13px}
@media(min-width:769px){table{font-size:14px}}
th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);border-bottom:1px solid var(--bd);font-weight:700;position:sticky;top:0;background:var(--card);z-index:2;white-space:nowrap}
@media(min-width:769px){th{padding:12px 16px;font-size:11px}}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
@media(min-width:769px){td{padding:12px 16px}}
tbody tr:last-child td{border-bottom:none}tbody tr:hover{background:var(--card-h)}
.srt{cursor:pointer;user-select:none}
.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border-radius:var(--rd);border:1px solid var(--bd);-webkit-overflow-scrolling:touch}
.tbl-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;color:var(--tx2);background:var(--card);border:1px solid var(--bd);border-top:none;border-radius:0 0 var(--rd) var(--rd);flex-wrap:wrap;gap:8px}
.tbl-search{position:relative;flex:1;max-width:340px;min-width:180px}.tbl-search input{padding-left:36px}.tbl-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mt);font-size:14px}
.tbl-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tf{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx2);font-family:inherit;min-height:36px}
.tf.act{background:var(--ac);color:#000;border-color:var(--ac)}
.empty-state{text-align:center;padding:40px 20px;color:var(--mt)}
.empty-state i{font-size:40px;margin-bottom:12px;display:block;opacity:.5}
.confirm-box{padding:20px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;margin-bottom:16px;text-align:center}
.confirm-box i{font-size:32px;color:#FBBF24;margin-bottom:12px;display:block}
.notif-panel{position:fixed;top:var(--hdh);right:0;width:100%;max-height:70vh;background:var(--card);border:1px solid var(--bd);border-radius:0 0 16px 16px;z-index:1500;box-shadow:var(--sh);overflow:hidden;display:none;animation:su .2s}
@media(min-width:769px){.notif-panel{right:24px;width:360px;max-height:440px;border-radius:12px}}
.notif-panel.show{display:block}
.notif-hdr{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.notif-item{padding:14px 18px;border-bottom:1px solid var(--bd);cursor:pointer}.notif-item:hover{background:var(--abg)}.notif-item:last-child{border:none}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex-shrink:0}
.notif-text{font-size:13px;color:var(--tx)}.notif-time{font-size:11px;color:var(--mt);margin-top:4px}
.vplayer{position:relative;height:200px;background:radial-gradient(ellipse at center,#13202E,#05080C);border-radius:12px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden}
@media(min-width:769px){.vplayer{height:260px}}
.vplay{position:absolute;width:72px;height:72px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;color:#000;font-size:26px;cursor:pointer;box-shadow:0 8px 30px rgba(245,158,11,.35);border:none;z-index:2}
.vbar{position:absolute;bottom:0;left:0;right:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;align-items:center;gap:12px;font-size:12px;color:#cbd5e1}
video{width:100%;border-radius:12px;background:#000;display:block;max-height:400px}
.qopt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:15px;min-height:48px}
.qopt:hover{border-color:var(--ac);background:var(--abg)}
.qopt input{accent-color:var(--ac);width:20px;height:20px;flex-shrink:0}
.pck{border:1px solid var(--bd);border-radius:12px;padding:16px;background:var(--card)}
.pck.done{border-color:rgba(16,185,129,.45)}.pck.cur{border-color:var(--ac)}.pck.lock{opacity:.45}
.pass-qr{background:#fff;padding:12px;border-radius:16px;display:inline-block}
.doc-card{max-width:560px;margin:0 auto;text-align:center;border:1px solid var(--ac);border-radius:20px;overflow:hidden;background:var(--card)}
.doc-hdr{padding:14px;background:linear-gradient(135deg,#F59E0B,#D97706);color:#000}
.doc-hdr.life{background:linear-gradient(135deg,#10B981,#059669)}
.doc-body{padding:20px}
.doc-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--bd);text-align:left}
.doc-row:last-child{border:none}
.doc-row span:first-child{color:var(--tx2)}
.doc-row span:last-child{font-weight:600;word-break:break-word}
.si{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.si:last-child{border:none}
.mem-row{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.mem-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.mem-fields{grid-template-columns:1fr}}
.det{min-width:130px}
.mobile-only{display:none}
@media(max-width:768px){.mobile-only{display:block}}
.desktop-only{display:block}
@media(max-width:768px){.desktop-only{display:none}}
.hide-sm{}
@media(max-width:768px){.hide-sm{display:none!important}}
.cdd{position:relative;display:block}
.cdd-btn{width:100%;padding:11px 36px 11px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:14px;font-family:inherit;min-height:44px;text-align:left;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdd-btn::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--tx2);font-size:12px;pointer-events:none}
.cdd-btn:focus{outline:none;border-color:var(--ac)}
.cdd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;z-index:5000;max-height:240px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.35);display:none;animation:su .15s}
.cdd-panel.open{display:block}
.cdd-opt{padding:11px 14px;font-size:14px;cursor:pointer;color:var(--tx);border-bottom:1px solid var(--bd)}
.cdd-opt:last-child{border-bottom:none}
.cdd-opt:hover{background:var(--abg);color:var(--ac)}
.cdd-opt.sel{background:var(--abg);color:var(--ac);font-weight:600}
@media(max-width:768px){
 #sb{transform:translateX(-100%);width:280px!important}
 #sb.open{transform:translateX(0)}
 #sb-overlay.show{display:block}
 #ma{margin-left:0!important}#sb.col~#ma{margin-left:0}
 .ll{display:none}.lr{width:100%;flex:1;padding:32px 24px}
 .b:not(.bsm){width:100%;justify-content:center}
 .i{font-size:16px}
 .seg{width:100%}.seg button{flex:1;justify-content:center;padding:8px 10px;font-size:12px;min-height:40px}
 .page-actions{flex-direction:column}.page-actions .b{width:100%;justify-content:center}
}
@media(max-width:380px){.doc-row{flex-direction:column;gap:2px}}
@media print{#sb,#hd,.notif-panel,#tc,#sb-overlay,.cdd-panel{display:none!important}#ma{margin:0!important}#pc{padding:0}}
</style>
</head>
<body>

<div id="ls">
  <div class="ll"><canvas id="lc"></canvas>
    <div style="position:relative;z-index:2;text-align:center;padding:40px">
      <div class="fd" style="font-size:60px;font-weight:700;color:var(--ac)">DIGI360</div>
      <div style="font-size:17px;color:var(--tx2);margin-top:8px;letter-spacing:2px">SAFETY INDUCTION PLATFORM</div>
    </div>
  </div>
  <div class="lr">
    <div style="margin-bottom:28px"><div class="fd" style="font-size:24px;font-weight:700">Sign In</div><div style="color:var(--tx2);font-size:14px;margin-top:4px">Enter your credentials</div></div>
    <div class="lmt" id="lmt">
      <button class="act" data-m="staff" type="button" onclick="swLM('staff')"><i class="fas fa-user-tie" style="margin-right:6px"></i>Staff</button>
      <button data-m="visitor" type="button" onclick="swLM('visitor')"><i class="fas fa-user" style="margin-right:6px"></i>Inductee</button>
    </div>
    <form onsubmit="doLogin();return false" autocomplete="off">
      <div style="margin-bottom:16px"><label class="lb">Plant / Site</label><select class="i sl" id="l-pl"><option>Jaipur Plant</option></select></div>
      <div id="sf-staff">
        <div style="margin-bottom:16px"><label class="lb">Username</label><input class="i" id="l-un" placeholder="Username" autocapitalize="none"></div>
        <div style="margin-bottom:24px"><label class="lb">Password</label><input class="i" id="l-pw" type="password" placeholder="Password"></div>
      </div>
      <div id="sf-vis" style="display:none">
        <div style="margin-bottom:16px"><label class="lb">Mobile Number</label><input class="i" id="l-mob" placeholder="Mobile number" type="tel"></div>
        <div style="margin-bottom:16px;padding:10px;background:var(--abg);border-radius:8px;font-size:12px;color:var(--tx2)"><i class="fas fa-mobile-screen" style="color:var(--ac)"></i> Sign in with your registered mobile number.</div>
      </div>
      <button type="submit" class="bp" style="width:100%;justify-content:center;padding:14px;font-size:16px"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>
    </form>
    <div style="margin-top:20px;padding:14px;background:var(--abg);border-radius:10px;font-size:12px;color:var(--tx2);line-height:1.8">
  <i class="fas fa-shield-halved" style="color:var(--ac)"></i> Authorized personnel only. Contact your administrator for credentials.
</div>
  </div>
</div>

<div id="app">
  <div id="sb-overlay" onclick="toggleSb()"></div>
  <aside id="sb">
    <div style="padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px">
      <div class="fd" style="width:36px;height:36px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:14px;flex-shrink:0">D3</div>
      <div class="sht"><div class="fd" style="font-weight:700;font-size:15px">DIGI360</div><div style="font-size:11px;color:var(--mt)">HSE Module</div></div>
    </div>
    <nav style="flex:1;padding:12px 0;overflow-y:auto" id="nl"></nav>
    <div style="padding:16px;border-top:1px solid var(--bd)">
      <div style="display:flex;align-items:center;gap:10px">
        <div id="sb-av" style="width:34px;height:34px;border-radius:50%;background:var(--abg);display:flex;align-items:center;justify-content:center;color:var(--ac);font-weight:700;font-size:13px;flex-shrink:0">A</div>
        <div class="sui" style="min-width:0;overflow:hidden"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sb-nm">Admin</div><div style="font-size:11px;color:var(--mt)" id="sb-pr">Administrator</div></div>
      </div>
      <button class="bs bsm" style="width:100%;margin-top:12px;justify-content:center" onclick="doLogout()"><i class="fas fa-right-from-bracket"></i><span class="nl">Logout</span></button>
      <a href="permits.html" class="bs bsm" style="display:flex;width:100%;margin-top:8px;justify-content:center;text-decoration:none;color:inherit"><i class="fas fa-file-signature"></i><span class="nl">Permits</span></a>
      <a href="assets.html" class="bs bsm" style="display:flex;width:100%;margin-top:8px;justify-content:center;text-decoration:none;color:inherit"><i class="fas fa-boxes-stacked"></i><span class="nl">Assets</span></a>
    </div>
  </aside>

function initCDD(){

  if(sel.dataset.cdd==='1')return;
  sel.dataset.cdd='1';
  sel.style.display='none';
  var wrap=document.createElement('div');wrap.className='cdd';
  var btn=document.createElement('button');btn.type='button';btn.className='cdd-btn';
  var panel=document.createElement('div');panel.className='cdd-panel';
  function refresh(){
   var txt=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:(sel.placeholder||'Select');
   btn.textContent=txt;
   panel.innerHTML='';
   [].forEach.call(sel.options,function(o){
    var d=document.createElement('div');d.className='cdd-opt'+(o.selected?' sel':'');d.textContent=o.text;
    d.onclick=function(ev){ev.stopPropagation();sel.value=o.value;
     sel.dispatchEvent(new Event('change',{bubbles:true}));refresh();panel.classList.remove('open')};
    panel.appendChild(d)})}
  btn.onclick=function(ev){ev.stopPropagation();
   var open=panel.classList.contains('open');
   document.querySelectorAll('.cdd-panel.open').forEach(function(p){p.classList.remove('open')});
   if(!open){refresh();panel.classList.add('open');
    var r=panel.getBoundingClientRect();
    panel.style.maxHeight=r.bottom>innerHeight?Math.max(120,innerHeight-r.top-10)+'px':'240px'}};
  document.addEventListener('click',function(){panel.classList.remove('open')});
  sel.addEventListener('change',refresh);
  wrap.appendChild(btn);wrap.appendChild(panel);
  sel.parentNode.insertBefore(wrap,sel.nextSibling);
  refresh()})}

else{VID={id:vpid,total:Math.min(secOf(p.dur),15),t:0};showM(esc(p.name),'<div class="vplayer"><button class="vplay" id="vpp" onclick="vidPlay()"><i class="fas fa-play"></i></button><div class="vbar"><span id="vpt">0:00</span><div class="pb" style="flex:1"><div class="pf" id="vpb" style="width:0%"></div></div></div></div><div style="font-size:12px;color:var(--tx2);margin:12px 0">Demo playback</div><button class="bp" id="vdone" style="width:100%;justify-content:center" disabled onclick="startQuiz(\''+vpid+'\')">Take Assessment</button>')}}
function vidPlay(){var b=document.getElementById('vpp');if(b)b.style.display='none';if(VPLAY)clearInterval(VPLAY);if(!VID)return;VPLAY=setInterval(function(){if(!VID){clearInterval(VPLAY);VPLAY=null;return}VID.t+=.1;var pct=Math.min(100,VID.t/VID.total*100);var bar=document.getElementById('vpb'),tm=document.getElementById('vpt');if(bar)bar.style.width=pct+'%';if(tm)tm.textContent=fmtT(Math.min(VID.t,VID.total));if(pct>=100){clearInterval(VPLAY);VPLAY=null;ppe(VP,VID.id).vd=true;var d=document.getElementById('vdone');if(d)d.disabled=false;toast('Video complete','s')}},100)}
function startQuiz(vpid){var v=VP,p=gVPack(vpid);if(!p)return;if(v.grp){toast('In-person induction','i');return}var e=ppe(v,vpid);if(e.ps){toast('Already passed','i');return}if(e.at>=DB.cfg.maxT){toast('No attempts remaining','e');return}if(VPLAY){clearInterval(VPLAY);VPLAY=null}var qH=p.qs.map(function(q,i){return '<div style="margin-bottom:14px"><div style="font-weight:600;font-size:14px;margin-bottom:8px">'+(i+1)+'. '+esc(q.text)+'</div>'+q.ops.map(function(op,j){return '<label class="qopt"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+String.fromCharCode(65+j)+'. '+esc(op)+'</span></label>'}).join('')+'</div>'}).join('');showM('Assessment - '+esc(p.name),'<div style="font-size:12px;color:var(--tx2);margin-bottom:14px">'+p.qs.length+' questions · pass '+DB.cfg.pass+'%</div>'+qH+'<button class="bp" style="width:100%;justify-content:center" onclick="submitQuiz(\''+vpid+'\')">Submit Answers</button>',true)}
function submitQuiz(vpid){var v=VP,p=gVPack(vpid);if(!p)return;var e=ppe(v,vpid);var ans=[];for(var i=0;i<p.qs.length;i++){var s=document.querySelector('input[name=q'+i+']:checked');if(!s){toast('Answer question '+(i+1),'w');return}ans.push(+s.value)}var cor=0;p.qs.forEach(function(q,i){if(ans[i]===q.ans)cor++});var sc=Math.round(cor/p.qs.length*100);e.at++;e.sc=sc;e.ps=sc>=DB.cfg.pass;e.vd=true;var pass=e.ps,over=!pass&&e.at>=DB.cfg.maxAt;if(pass){pushNotif(v.nm+' passed - '+sc+'%','fa-circle-check','var(--ok)');if(allPassed(v)){issueDoc(v);if(['Invited','Pending','Failed Assessment'].indexOf(v.st)>-1){v.st='Approved';pushAudit(v.id,'Pending','Approved','All packs passed')}}}else if(over){v.st='Failed Assessment';pushAudit(v.id,v.st,'Failed','Attempt limit');pushNotif(v.nm+' failed attempts','fa-triangle-exclamation','var(--err)')}sbVis(v);var final=pass&&allPassed(v),d=v.doc;var body='<div style="text-align:center"><i class="fas '+(pass?'fa-circle-check':'fa-circle-xmark')+'" style="font-size:48px;color:var(--'+(pass?'ok':'err')+');margin-bottom:10px;display:block"></i><div class="fd" style="font-size:42px;font-weight:800">'+sc+'%</div><div style="font-size:13px;color:var(--tx2);margin-top:4px">'+cor+' of '+p.qs.length+' correct</div></div>';if(final&&d)body+='<div class="c" style="background:var(--bg2);margin-top:14px;text-align:center"><div style="font-weight:700;font-size:14px">'+docName(d)+' generated</div><div style="font-size:12px;color:var(--tx2)">'+d.id+' · valid till '+d.expires+'</div></div><button class="bg" style="width:100%;justify-content:center;margin-top:14px" onclick="closeM();renderInducteeFlow()">View Document</button>';else if(pass)body+='<button class="bg" style="width:100%;justify-content:center;margin-top:14px" onclick="closeM();renderInducteeFlow()">Continue</button>';else if(!over)body+='<button class="bp" style="width:100%;justify-content:center;margin-top:14px" onclick="startQuiz(\''+vpid+'\')">Retake</button>';else body+='<button class="bs" style="width:100%;justify-content:center;margin-top:14px" onclick="closeM();renderInducteeFlow()">Close</button>';showM('Result',body)}

function initLoginCanvas(){var c=document.getElementById('lc');if(!c||!c.getContext)return;var x=c.getContext('2d'),W=10,H=10,pts=[];function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;pts=[];var n=Math.max(24,Math.min(80,Math.round(W*H/16000)));for(var i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*1.5+.6})}function fr(){if(document.getElementById('ls').style.display==='none')return;x.clearRect(0,0,W,H);x.fillStyle='rgba(245,158,11,.45)';for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,p.r,0,6.2832);x.fill()}x.strokeStyle='rgba(245,158,11,.07)';x.lineWidth=1;for(var a=0;a<pts.length;a++)for(var b=a+1;b<pts.length;b++){var dx=pts[a].x-pts[b].x,dy=pts[a].y-pts[b].y;if(dx*dx+dy*dy<13000){x.beginPath();x.moveTo(pts[a].x,pts[a].y);x.lineTo(pts[b].x,pts[b].y);x.stroke()}}requestAnimationFrame(fr)}rs();window.addEventListener('resize',rs);fr()}

 document.addEventListener('click',function(e){if(window.innerWidth<=768){var sb=document.getElementById('sb');if(sb.classList.contains('open')&&!sb.contains(e.target)&&!e.target.closest('.mobile-only')){closeSbMobile()}}})})();

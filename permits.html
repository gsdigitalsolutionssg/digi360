  h+='<div><label class="lb">Work Description *</label><textarea class="i" id="cp-desc" rows="3" placeholder="Describe the work to be performed..."></textarea></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><label class="lb">Start Date/Time *</label><input class="i" id="cp-start" type="datetime-local"></div><div><label class="lb">End Date/Time *</label><input class="i" id="cp-end" type="datetime-local"></div></div>';

function onTypeChange(){
  var tid=val('cp-type');var show=!!tid;
  ['cp-details','cp-persons-section','cp-ppe-section','cp-tools-section','cp-checklists-section'].forEach(function(id){var el=document.getElementById(id);if(el)el.style.display=show?'block':'none'});
  var actEl=document.getElementById('cp-actions');if(actEl)actEl.style.display=show?'flex':'none';
  if(show){var t=gPType(tid);var riskSel=document.getElementById('cp-risk');if(riskSel&&t.risk_levels)riskSel.innerHTML=t.risk_levels.map(function(r){return '<option>'+r+'</option>'}).join('');
    renderCreateChecklists(tid);
    var now=new Date(),p=function(n){return n<10?'0'+n:n};var ds=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+'T'+p(now.getHours())+':'+p(now.getMinutes());
    var ed=new Date(now.getTime()+8*3600000);var de=ed.getFullYear()+'-'+p(ed.getMonth()+1)+'-'+p(ed.getDate())+'T'+p(ed.getHours())+':'+p(ed.getMinutes());
    var s=document.getElementById('cp-start');if(s)s.value=ds;var e=document.getElementById('cp-end');if(e)e.value=de}}
function renderCreateChecklists(tid){
  var cls=gChecklists(tid).filter(function(c){return c.category==='start'});
  var box=document.getElementById('cp-checklists');if(!box)return;
  if(!cls.length){box.innerHTML='<div style="color:var(--mt);font-size:13px">No start checklists for this permit type.</div>';return}
  box.innerHTML=cls.map(function(c){PERMIT_CL[c.id]={answers:{},completed:false};
    return '<div class="c" style="background:var(--bg2);margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-weight:700;font-size:14px">'+esc(c.name)+'</span>'+apprBadge(c.approval_type)+'</div>'+
    c.items.map(function(item,i){var id='cl-'+c.id+'-'+i;
      if(item.type==='checkbox')return '<label class="qopt"><input type="checkbox" id="'+id+'" onchange="PERMIT_CL[\''+c.id+'\'].answers['+i+']=this.checked"><span>'+esc(item.text)+'</span></label>';
      return '<div style="margin-bottom:8px"><label style="font-size:13px;display:block;margin-bottom:4px">'+esc(item.text)+'</label><input class="i" id="'+id+'" placeholder="'+esc(item.placeholder||'Enter value')+'" oninput="PERMIT_CL[\''+c.id+'\'].answers['+i+']=this.value"></div>'}).join('')+'</div>'}).join('')}
function addPerson(){
  var q=val('cp-person-search');if(!q){toast('Enter phone or passport ID','w');return}
  var visitor=DB.visitors.find(function(v){return v.mob===q||(v.doc&&v.doc.id===q)});
  if(!visitor){toast('Person not found in induction system','e');return}
  if(!visitor.doc){toast(visitor.nm+' has not completed induction - no safety document issued','e');return}
  if(visitor.doc.expires&&visitor.doc.expires<today){toast(visitor.nm+' safety passport expired on '+visitor.doc.expires,'e');return}
  if(PERMIT_PERSONS.some(function(p){return p.visitor_id===visitor.id})){toast(visitor.nm+' already added','w');return}
  var pr=gProf(visitor.pid);
  PERMIT_PERSONS.push({visitor_id:visitor.id,name:visitor.nm,company:visitor.co,mobile:visitor.mob,passport_id:visitor.doc.id,passport_type:visitor.doc.type==='pass'?'Visitor Pass':'Safety Passport',passport_expires:visitor.doc.expires||'No expiry',induction_status:'Fully Inducted',profile:pr?pr.name:'-'});
  renderPersonsList();document.getElementById('cp-person-search').value='';toast(visitor.nm+' added','s')}
function renderPersonsList(){
  var box=document.getElementById('cp-persons-list');if(!box)return;
  if(!PERMIT_PERSONS.length){box.innerHTML='<div style="font-size:13px;color:var(--mt)">No persons added yet.</div>';return}
  box.innerHTML=PERMIT_PERSONS.map(function(p,i){
    return '<div class="c" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);margin-bottom:8px;padding:12px"><div style="flex:1;min-width:200px"><div style="font-weight:600;font-size:14px">'+esc(p.name)+'</div><div style="font-size:12px;color:var(--mt)">'+p.visitor_id+' - '+esc(p.company)+'</div><div style="font-size:11px;margin-top:4px"><span class="badge b-ok">'+p.passport_type+'</span> <span class="chip">'+p.passport_id+'</span> <span style="color:var(--ok)">Valid</span></div></div><button class="bd bsm" onclick="PERMIT_PERSONS.splice('+i+',1);renderPersonsList()"><i class="fas fa-times"></i></button></div>'}).join('')}
function savePermit(status){
  var tid=val('cp-type');if(!tid){toast('Select permit type','e');return}
  var title=val('cp-title');if(!title){toast('Enter title','e');return}
  var loc=val('cp-location');if(!loc){toast('Enter location','e');return}
  var start=val('cp-start'),end=val('cp-end');if(!start||!end){toast('Enter start and end times','e');return}
  if(!PERMIT_PERSONS.length){toast('Add at least one person','e');return}
  var clIds=Object.keys(PERMIT_CL);
  var clData={};clIds.forEach(function(cid){var c=DB.checklist_templates.filter(function(x){return x.id===cid})[0];clData[cid]={category:'start',approval_type:c?c.approval_type:'self_approval',answers:PERMIT_CL[cid].answers,completed:true,completed_at:nowStr()}});
  if(status==='Submitted'){var reqApproval=clIds.some(function(cid){var c=DB.checklist_templates.filter(function(x){return x.id===cid})[0];return c&&c.approval_type==='approval_required'});
    status=reqApproval?'Submitted':'Approved'}

 st.textContent='Connecting to database...';btn.parentNode.appendChild(st);btn.disabled=true;
 loadDB().then(function(){
   btn.disabled=false;st.innerHTML='<span style="color:var(--ok)">● Cloud connected</span>';
   toast('Database connected','s');
 }).catch(function(e){st.textContent='DB error: '+(e.message||e)});
 document.addEventListener('click',function(e){var p=document.getElementById('notif-panel');if(p&&p.classList.contains('show')&&!p.contains(e.target)&&!e.target.closest('#nbtn'))p.classList.remove('show')})})();
</script>
</body>

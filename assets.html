/* Custom Dropdown */
function initCDD(){
 document.querySelectorAll('select.sl').forEach(function(sel){
  if(sel.dataset.cdd==='1')return;
  sel.dataset.cdd='1';
  sel.style.display='none';
  var wrap=document.createElement('div');wrap.className='cdd';
  var btn=document.createElement('button');btn.type='button';btn.className='cdd-btn';
  var panel=document.createElement('div');panel.className='cdd-panel';
  function refresh(){
   var txt=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:(sel.placeholder||'Select');
   btn.textContent=txt;
   panel.innerHTML='';
   [].forEach.call(sel.options,function(o){
    var d=document.createElement('div');d.className='cdd-opt'+(o.selected?' sel':'');d.textContent=o.text;
    d.onclick=function(ev){ev.stopPropagation();sel.value=o.value;
     sel.dispatchEvent(new Event('change',{bubbles:true}));refresh();panel.classList.remove('open')};
    panel.appendChild(d)})}
  btn.onclick=function(ev){ev.stopPropagation();
   var open=panel.classList.contains('open');
   document.querySelectorAll('.cdd-panel.open').forEach(function(p){p.classList.remove('open')});
   if(!open){refresh();panel.classList.add('open');
    var r=panel.getBoundingClientRect();
    panel.style.maxHeight=r.bottom>innerHeight?Math.max(120,innerHeight-r.top-10)+'px':'240px'}};
  document.addEventListener('click',function(){panel.classList.remove('open')});
  sel.addEventListener('change',refresh);
  wrap.appendChild(btn);wrap.appendChild(panel);
  sel.parentNode.insertBefore(wrap,sel.nextSibling);
  refresh()})}

/* ============ ALERTS ENGINE ============ */
function generateAlerts(){
 var existing=DB.alerts.map(function(a){return a.asset_id+'|'+a.alert_type+'|'+a.due_date});
 DB.inspections.forEach(function(s){var a=gAsset(s.asset_id);if(!a||a.plant!==SPL)return;var days=daysUntil(s.next_due);
  if(days<=7&&existing.indexOf(s.asset_id+'|inspection:'+s.type+'|'+s.next_due)===-1){
   var al={asset_id:s.asset_id,alert_type:'inspection:'+s.type,message:'Inspection due for '+a.name+' ('+a.asset_number+') on '+s.next_due,due_date:s.next_due,severity:days<0?'critical':'warning',acknowledged:false,created_at:new Date().toISOString()};DB.alerts.unshift(al);sbAlert(al)}});
 DB.refills.forEach(function(s){var a=gAsset(s.asset_id);if(!a||a.plant!==SPL)return;var days=daysUntil(s.next_due);
  if(days<=7&&existing.indexOf(s.asset_id+'|refill:'+s.type+'|'+s.next_due)===-1){
   var al={asset_id:s.asset_id,alert_type:'refill:'+s.type,message:s.type+' due for '+a.name+' ('+a.asset_number+') on '+s.next_due,due_date:s.next_due,severity:days<0?'critical':'warning',acknowledged:false,created_at:new Date().toISOString()};DB.alerts.unshift(al);sbAlert(al)}});
 myAssets().forEach(function(a){
  if(a.expiry_date){var days=daysUntil(a.expiry_date);
   if(days<=30&&existing.indexOf(a.id+'|expiry|'+a.expiry_date)===-1){
    var al={asset_id:a.id,alert_type:'expiry',message:a.name+' ('+a.asset_number+') expires on '+a.expiry_date,due_date:a.expiry_date,severity:days<0?'critical':'warning',acknowledged:false,created_at:new Date().toISOString()};DB.alerts.unshift(al);sbAlert(al)}}
  if(a.min_quantity&&a.quantity<=a.min_quantity&&existing.indexOf(a.id+'|lowstock|')===-1){
   var al={asset_id:a.id,alert_type:'lowstock',message:a.name+' ('+a.asset_number+') low stock: '+a.quantity+' remaining (min '+a.min_quantity+')',due_date:null,severity:'critical',acknowledged:false,created_at:new Date().toISOString()};DB.alerts.unshift(al);sbAlert(al)}})}
function myAlerts(){return DB.alerts.filter(function(a){var as=gAsset(a.asset_id);return as&&as.plant===SPL&&!a.acknowledged})}

 var refillSoon=refill.filter(function(s){var d=daysUntil(s.next_due);return d>=0&&d<=7}).length;
 var expired=assets.filter(function(a){return a.expiry_date&&daysUntil(a.expiry_date)<0}).length;
 var expSoon=assets.filter(function(a){return a.expiry_date&&daysUntil(a.expiry_date)>=0&&daysUntil(a.expiry_date)<=30}).length;

  h+='</div>'}
 h+='<div class="kgrid">'+
  kpi('fa-boxes-stacked','Total Assets',assets.length,'cyan')+
  kpi('fa-clipboard-check','Insp Overdue',inspOverdue,'red')+
  kpi('fa-clock','Insp Due ≤7d',inspSoon,'amber')+
  kpi('fa-arrows-rotate','Refill Overdue',refillOverdue,'red')+

 '</div>';
 h+='<div class="page-actions"><button class="bp" onclick="showAssetForm(null)"><i class="fas fa-plus"></i> Add Asset</button><button class="bs" onclick="goTo(\'a-alerts\')"><i class="fas fa-bell"></i> Alerts</button></div>';

 insp.forEach(function(s){if(daysUntil(s.next_due)<=7){var a=gAsset(s.asset_id);upcoming.push({due:s.next_due,what:'Inspection',asset:a?a.name+' ('+a.asset_number+')':s.asset_id,fn:"goTo('a-insp')"})}});
 refill.forEach(function(s){if(daysUntil(s.next_due)<=7){var a=gAsset(s.asset_id);upcoming.push({due:s.next_due,what:s.type,asset:a?a.name+' ('+a.asset_number+')':s.asset_id,fn:"goTo('a-refill')"})}});
 upcoming.sort(function(a,b){return a.due<b.due?-1:1});
 if(upcoming.length){
  h+='<div class="tbl-wrap"><table><thead><tr><th>Due Date</th><th>Type</th><th>Asset</th><th>Status</th></tr></thead><tbody>'+

 } else h+='<div class="empty-state" style="padding:32px"><i class="fas fa-circle-check"></i><p>Nothing due in the next 7 days</p></div>';
 h+='</div>';return h}

 DB.consumLogs.unshift(log);sbConsumLog(log);
 closeM();toast(qty+' added - total '+a.quantity,'s');goTo('a-consum')}

/* ============ FIRE EXTINGUISHERS ============ */
function pgFire(){
 var list=myAssets().filter(function(a){var c=gCat(a.category_id);return c&&c.id==='AC-FIRE'});
 var h=bc([{label:'Dashboard',action:"goTo('landing')"},{label:'Fire Extinguishers'}]);
 h+='<div class="page-actions"><button class="bp" onclick="showAssetForm(null)"><i class="fas fa-plus"></i> Add Extinguisher</button></div>';
 if(!list.length)h+='<div class="empty-state"><i class="fas fa-fire-extinguisher"></i><p>No fire extinguishers registered</p></div>';
 else{h+='<div class="tbl-wrap"><table><thead><tr><th>Number</th><th>Type</th><th>Location</th><th>Next Inspection</th><th>Status</th><th></th></tr></thead><tbody>';
 list.forEach(function(a){
  var insp=DB.inspections.filter(function(s){return s.asset_id===a.id})[0];
  h+='<tr data-n="'+esc((a.name+' '+a.asset_number+' '+(a.location||'')).toLowerCase()+'"><td style="font-weight:600;color:var(--ac)">'+esc(a.asset_number)+'</td><td>'+typeBadge(a.type_id)+'</td><td>'+esc(a.location||'-')+'</td><td>'+(insp?dueBadge(insp.next_due):'<span class="badge b-err">No schedule</span>')+'</td><td>'+stBadge(a.status)+'</td><td>'+(insp?'<button class="bg bsm" onclick="doInsp(\''+insp.id+'\')"><i class="fas fa-clipboard-check"></i> Inspect</button>':'<button class="bp bsm" onclick="showInspForm(null)">Schedule</button>')+'</td></tr>'});
 h+='</tbody></table></div>'}
 return h}

/* ============ ALERTS PAGE ============ */
function pgAlerts(){
 generateAlerts();
 var list=myAlerts();
 var h=bc([{label:'Dashboard',action:"goTo('landing')"},{label:'Alerts'}]);
 h+='<div class="kgrid">'+kpi('fa-bell','Active Alerts',list.length,'amber')+kpi('fa-circle-exclamation','Critical',list.filter(function(a){return a.severity==='critical'}).length,'red')+kpi('fa-triangle-exclamation','Warnings',list.filter(function(a){return a.severity==='warning'}).length,'amber')+'</div>';
 h+='<div class="c p0">';
 if(!list.length)h+='<div class="empty-state"><i class="fas fa-circle-check"></i><p>No active alerts. All clear!</p></div>';
 else{h+='<div class="tbl-wrap" style="border:none"><table><thead><tr><th>Severity</th><th>Alert</th><th class="hide-sm">Due Date</th><th></th></tr></thead><tbody>';
 list.forEach(function(a){
  h+='<tr><td><span class="badge '+(a.severity==='critical'?'b-err':'b-wrn')+'">'+a.severity.toUpperCase()+'</span></td><td style="font-weight:600">'+esc(a.message)+'</td><td class="hide-sm">'+(a.due_date||'-')+'</td><td><button class="bs bsm" onclick="ackAlert('+a.id+')">Acknowledge</button></td></tr>'});
 h+='</tbody></table></div>'}
 h+='</div>';return h}

/* ============ CHECKLISTS ============ */
function pgChecklists(){
 var h=bc([{label:'Dashboard',action:"goTo('landing')"},{label:'Checklists'}]);
 h+='<div class="page-actions"><button class="bp" onclick="showClForm(null)"><i class="fas fa-plus"></i> Add Checklist</button></div>';
 h+='<div style="display:grid;gap:10px">';
 DB.checklists.forEach(function(c){
  h+='<div class="c" style="background:var(--bg2)"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><div style="font-weight:700;font-size:15px">'+esc(c.name)+'</div><div style="font-size:12px;color:var(--mt)">'+(c.asset_type_id?(gType(c.asset_type_id)||{}).name||c.asset_type_id:'Any type')+' · '+c.items.length+' items</div></div><button class="bs bsm" onclick="showClForm(\''+c.id+'\')"><i class="fas fa-pen"></i></button></div></div>'});
 h+='</div>';return h}
function showClForm(id){var c=id?gChecklist(id):{name:'',asset_type_id:'',items:[],active:true};
 var typeOpts='<option value="">-- Any Type --</option>'+DB.types.map(function(t){return '<option value="'+t.id+'"'+(c.asset_type_id===t.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('');
 showM((id?'Edit':'Add')+' Checklist','<div style="display:grid;gap:14px">'+
 '<div><label class="lb">Checklist Name *</label><input class="i" id="cl-nm" value="'+esc(c.name)+'" placeholder="Fire Extinguisher Inspection"></div>'+
 '<div><label class="lb">Asset Type</label><select class="i sl" id="cl-type">'+typeOpts+'</select></div>'+
 '<div><label class="lb">Items (one per line: text | checkbox or text)</label><textarea class="i" id="cl-items" rows="8" placeholder="Pressure gauge in green zone | checkbox&#10;Gas test reading | text">'+esc((c.items||[]).map(function(item){return item.text+' | '+(item.type||'checkbox')}).join('\n'))+'</textarea></div>'+
 '<button class="bp" onclick="saveCl(\''+(id||'')+'\')">Save</button></div>')}
function saveCl(id){var nm=val('cl-nm');if(!nm){toast('Enter name','e');return}
 var lines=val('cl-items').split('\n').filter(function(l){return l.trim()});
 var items=lines.map(function(l){var parts=l.split('|');var text=parts[0].trim();var tp=(parts[1]||'checkbox').trim()==='text'?'text':'checkbox';return{text:text,type:tp,required:true}});
 if(!items.length){toast('Add at least one item','e');return}
 var row={id:id||gid('ACL-'),name:nm,asset_type_id:val('cl-type')||null,items:items,active:true};
 if(id){Object.assign(gChecklist(id),row)}else{DB.checklists.push(row)}
 sbChecklist(row);closeM();toast('Checklist saved','s');goTo('a-checklists')}

/* ============ CONFIG ============ */
function pgConfig(){
 var h=bc([{label:'Dashboard',action:"goTo('landing')"},{label:'Categories & Types'}]);
 h+='<div class="two"><div class="c p0"><div style="padding:12px 14px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h4 class="fd" style="font-size:14px">Categories ('+DB.categories.length+')</h4><button class="bp bsm" onclick="showCatForm(null)"><i class="fas fa-plus"></i></button></div><div style="padding:0 14px 14px;display:grid;gap:8px">';
 DB.categories.forEach(function(c){h+='<div class="qopt" style="cursor:default"><i class="fas '+(c.icon||'fa-box')+'" style="color:'+(c.color||'#F59E0B')+';width:20px"></i><span style="flex:1;font-weight:600">'+esc(c.name)+'</span><button class="bs bsm" onclick="showCatForm(\''+c.id+'\')"><i class="fas fa-pen"></i></button></div>'});
 h+='</div></div>';
 h+='<div class="c p0"><div style="padding:12px 14px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h4 class="fd" style="font-size:14px">Types ('+DB.types.length+')</h4><button class="bp bsm" onclick="showTypeForm(null)"><i class="fas fa-plus"></i></button></div><div style="padding:0 14px 14px;display:grid;gap:8px">';
 DB.types.forEach(function(t){var c=gCat(t.category_id);h+='<div class="qopt" style="cursor:default"><i class="fas '+(t.icon||'fa-box')+'" style="color:var(--ac);width:20px"></i><span style="flex:1">'+esc(t.name)+' <span style="color:var(--mt);font-size:11px">('+(c?c.name:'-')+')</span></span><button class="bs bsm" onclick="showTypeForm(\''+t.id+'\')"><i class="fas fa-pen"></i></button></div>'});
 h+='</div></div></div>';return h}
function showCatForm(id){var c=id?gCat(id):{name:'',icon:'fa-box',color:'#F59E0B',active:true};
 showM((id?'Edit':'Add')+' Category','<div style="display:grid;gap:14px"><div><label class="lb">Name *</label><input class="i" id="cat-nm" value="'+esc(c.name)+'"></div><div class="form-row"><div><label class="lb">Icon</label><input class="i" id="cat-icon" value="'+esc(c.icon||'')+'" placeholder="fa-fire-extinguisher"></div><div><label class="lb">Color</label><input class="i" id="cat-color" value="'+esc(c.color||'')+'" placeholder="#EF4444"></div></div><button class="bp" onclick="saveCat(\''+(id||'')+'\')">Save</button></div>')}
function saveCat(id){var nm=val('cat-nm');if(!nm){toast('Enter name','e');return}
 var row={id:id||gid('AC-'),name:nm,icon:val('cat-icon'),color:val('cat-color'),active:true};
 if(id){Object.assign(gCat(id),row)}else{DB.categories.push(row)}
 _post('asset_categories',row,'resolution=merge-duplicates');closeM();toast('Saved','s');goTo('a-config')}
function showTypeForm(id){var t=id?gType(id):{name:'',category_id:'',icon:'',active:true};
 var catOpts=DB.categories.map(function(c){return '<option value="'+c.id+'"'+(t.category_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
 showM((id?'Edit':'Add')+' Type','<div style="display:grid;gap:14px"><div><label class="lb">Name *</label><input class="i" id="typ-nm" value="'+esc(t.name)+'"></div><div class="form-row"><div><label class="lb">Category</label><select class="i sl" id="typ-cat">'+catOpts+'</select></div><div><label class="lb">Icon</label><input class="i" id="typ-icon" value="'+esc(t.icon||'')+'" placeholder="fa-helmet-safety"></div></div><button class="bp" onclick="saveType(\''+(id||'')+'\')">Save</button></div>')}
function saveType(id){var nm=val('typ-nm');if(!nm){toast('Enter name','e');return}
 var row={id:id||gid('AT-'),name:nm,category_id:val('typ-cat'),icon:val('typ-icon'),active:true};
 if(id){Object.assign(gType(id),row)}else{DB.types.push(row)}
 _post('asset_types',row,'resolution=merge-duplicates');closeM();toast('Saved','s');goTo('a-config')}

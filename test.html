<div id="r" style="margin-top:20px;font-size:13px;color:#8899AA"></div>
<script>
var URL='https://hgffeevtuvhexrztacpd.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnZmZlZXZ0dXZoZXhyenRhY3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODgyMzYsImV4cCI6MjEwMzA2NDIzNn0.Xv3z6mbur5J6bULJHAXhMQ9Qh5f_Syskw-tHQ1WZ7gA';

var s=document.getElementById('s'),r=document.getElementById('r');

}).then(function(data){

  s.style.color='#EF4444';
